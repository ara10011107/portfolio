<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>관리자 | Portfolio</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ===== 관리자 화면에만 쓰는 모양 (색·글꼴은 style.css 그대로) ===== */
    .panel {
      background: var(--sheet);
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(17, 24, 39, 0.06);
      padding: 40px 48px;
      margin-bottom: 32px;
    }

    .panel[hidden] {
      display: none;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .top .big-title {
      margin: 0;
    }

    .top-right {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 14px;
      color: var(--gray);
    }

    .top-right a {
      color: var(--blue);
      font-weight: 700;
      text-decoration: none;
    }

    .section-title {
      margin: 0 0 24px;
      padding-left: 14px;
      border-left: 5px solid var(--blue);
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.04em;
      line-height: 1.2;
    }

    .help {
      margin: -12px 0 20px;
      color: var(--gray);
      font-size: 14px;
    }

    /* 입력 칸 */
    .form {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px 16px;
    }

    .field {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .field.wide {
      grid-column: 1 / -1;
    }

    .field > span {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: var(--gray);
    }

    .field input,
    .field textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      font: inherit;
      font-size: 14px;
      resize: vertical;
      background: #fff;
    }

    .field input[readonly] {
      background: #f7f8fa;
      color: var(--gray);
    }

    .field input:focus,
    .field textarea:focus {
      outline: 2px solid var(--blue);
      outline-offset: -1px;
    }

    .file-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .file-row input[type="file"] {
      flex: 1;
      min-width: 0;
      padding: 8px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      font-size: 13px;
    }

    .preview {
      width: 96px;
      height: 96px;
      border-radius: 16px;
      background: var(--placeholder);
      overflow: hidden;
      flex: none;
    }

    .preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .actions {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 4px;
    }

    .msg {
      margin: 0;
      font-size: 13px;
      color: var(--gray);
    }

    .msg.error {
      color: #dc2626;
    }

    /* 버튼 */
    .btn {
      padding: 10px 22px;
      border: 0;
      border-radius: 999px;
      background: var(--blue);
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn.line {
      background: #fff;
      border: 1px solid var(--line);
      color: var(--text);
    }

    .btn.danger {
      background: #fff;
      border: 1px solid #fecaca;
      color: #dc2626;
    }

    .btn.small {
      padding: 6px 12px;
      font-size: 12px;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    /* 로그인 */
    .login {
      max-width: 420px;
      margin: 0 auto 32px;
    }

    .login .form {
      grid-template-columns: 1fr;
    }

    .notice {
      text-align: center;
      font-size: 18px;
      font-weight: 800;
    }

    /* 목록 */
    .list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 12px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    .row.editing {
      border-color: var(--blue);
      background: var(--blue-soft);
    }

    .row-thumb {
      width: 72px;
      aspect-ratio: 16 / 10;
      border-radius: 8px;
      background: var(--placeholder);
      overflow: hidden;
      flex: none;
    }

    .row-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .row-main {
      flex: 1;
      min-width: 0;
    }

    .row-meta {
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
    }

    .row-title {
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .row-sub {
      color: var(--gray);
      font-size: 13px;
      overflow-wrap: anywhere;
      white-space: pre-line;
    }

    .row-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
      flex: none;
    }

    .count {
      font-weight: 800;
      color: #e11d48;
    }

    .divider {
      margin: 32px 0 24px;
      border: 0;
      border-top: 1px solid var(--line);
    }

    @media (max-width: 860px) {
      .panel {
        padding: 28px 20px;
      }

      .form {
        grid-template-columns: 1fr;
      }

      .row {
        flex-wrap: wrap;
      }

      .row-buttons {
        width: 100%;
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <main class="page">

    <!-- 맨 위 -->
    <section class="panel top">
      <h1 class="big-title">ADMIN</h1>
      <div class="top-right">
        <span id="who"></span>
        <a href="index.html">방문자 화면 보기</a>
        <button type="button" class="btn line small" id="logout-btn" hidden>로그아웃</button>
      </div>
    </section>

    <!-- 로그인 -->
    <section class="panel login" id="login-panel" hidden>
      <h2 class="section-title">로그인</h2>
      <div class="form">
        <label class="field">
          <span>이메일</span>
          <input type="email" id="login-email" autocomplete="username">
        </label>
        <label class="field">
          <span>비밀번호</span>
          <input type="password" id="login-password" autocomplete="current-password">
        </label>
        <div class="actions">
          <p class="msg" id="login-msg"></p>
          <button type="button" class="btn" id="login-btn">로그인</button>
        </div>
      </div>
    </section>

    <!-- 관리자가 아닐 때 -->
    <section class="panel" id="not-admin-panel" hidden>
      <p class="notice">관리자만 쓸 수 있어요</p>
    </section>

    <!-- 관리자 화면 -->
    <div id="admin-area" hidden>

      <!-- 프로필 -->
      <section class="panel">
        <h2 class="section-title">프로필</h2>
        <div class="form">
          <div class="field wide">
            <span>프로필 사진 (이미지, 10MB까지 · 고르면 바로 올리고 저장돼요)</span>
            <div class="file-row">
              <div class="preview" id="photo-preview"></div>
              <input type="file" id="photo-file" accept="image/png,image/jpeg,image/webp,image/gif">
              <button type="button" class="btn line small" id="photo-clear">사진 빼기</button>
            </div>
          </div>
          <label class="field wide">
            <span>사진 주소 (photo_url)</span>
            <input type="text" id="pf-photo_url" readonly>
          </label>
          <label class="field"><span>이름</span><input type="text" id="pf-name"></label>
          <label class="field"><span>직함</span><input type="text" id="pf-title"></label>
          <label class="field"><span>경력 배지</span><input type="text" id="pf-career_badge"></label>
          <label class="field"><span>이메일</span><input type="text" id="pf-email"></label>
          <label class="field"><span>연락처</span><input type="text" id="pf-phone"></label>
          <label class="field"><span>위치</span><input type="text" id="pf-location"></label>
          <label class="field wide"><span>한 줄 소개 제목 (이름이 들어가면 파란 밑줄)</span><input type="text" id="pf-headline"></label>
          <label class="field wide"><span>소개 글</span><textarea id="pf-intro" rows="4"></textarea></label>
          <label class="field"><span>EDUCATION</span><textarea id="pf-education" rows="3"></textarea></label>
          <label class="field"><span>SKILLS &amp; TOOLS</span><textarea id="pf-skills" rows="3"></textarea></label>
          <label class="field wide"><span>EXPERIENCE</span><textarea id="pf-experience" rows="3"></textarea></label>
          <label class="field wide"><span>맨 아래 한 줄 인용</span><input type="text" id="pf-quote"></label>
          <div class="actions">
            <p class="msg" id="profile-msg"></p>
            <button type="button" class="btn" id="profile-save">프로필 저장</button>
          </div>
        </div>
      </section>

      <!-- 포트폴리오 카드 -->
      <section class="panel">
        <h2 class="section-title" id="project-form-title">카드 추가</h2>
        <div class="form">
          <label class="field"><span>번호 (예: 01)</span><input type="text" id="pj-number"></label>
          <label class="field"><span>분류</span><input type="text" id="pj-category"></label>
          <label class="field wide"><span>제목 (꼭 적기)</span><input type="text" id="pj-title"></label>
          <label class="field wide"><span>설명</span><textarea id="pj-description" rows="3"></textarea></label>
          <label class="field wide"><span>태그 (쉼표로 나누기, 예: 총괄 PM, UI/UX)</span><input type="text" id="pj-tags"></label>
          <div class="field">
            <span>썸네일 이미지 (이미지, 10MB까지)</span>
            <div class="file-row">
              <input type="file" id="pj-thumb-file" accept="image/png,image/jpeg,image/webp,image/gif">
              <button type="button" class="btn line small" id="pj-thumb-clear">빼기</button>
            </div>
            <input type="text" id="pj-thumbnail_url" readonly placeholder="없음">
          </div>
          <div class="field">
            <span>첨부 파일 (이미지 또는 PDF, 10MB까지)</span>
            <div class="file-row">
              <input type="file" id="pj-file-file" accept="image/png,image/jpeg,image/webp,image/gif,application/pdf">
              <button type="button" class="btn line small" id="pj-file-clear">빼기</button>
            </div>
            <input type="text" id="pj-file_url" readonly placeholder="없음">
          </div>
          <div class="actions">
            <p class="msg" id="project-msg"></p>
            <button type="button" class="btn line" id="project-cancel" hidden>수정 그만두기</button>
            <button type="button" class="btn" id="project-save">카드 추가</button>
          </div>
        </div>

        <hr class="divider">

        <h2 class="section-title">카드 목록</h2>
        <p class="help">방문자 화면에 이 순서대로 보여요. 하트 숫자는 좋아요 수예요.</p>
        <ul class="list" id="project-list"></ul>
      </section>

      <!-- 좋아요 -->
      <section class="panel">
        <h2 class="section-title">좋아요</h2>
        <ul class="list" id="like-list"></ul>
      </section>

      <!-- 방명록 -->
      <section class="panel">
        <h2 class="section-title">방명록</h2>
        <ul class="list" id="guestbook-list"></ul>
      </section>

    </div>
  </main>

  <script src="admin.js"></script>
</body>
</html>
