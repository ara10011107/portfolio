<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">

    <!-- 흰 큰 카드 -->
    <section class="sheet">

      <!-- 왼쪽: ABOUT ME -->
      <aside class="about">
        <p class="label">ABOUT ME</p>

        <div class="photo" id="photo">
          <svg class="photo-empty" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/>
          </svg>
        </div>

        <h2 class="name" id="name"></h2>
        <p class="job" id="title"></p>
        <p class="badge" id="career-badge"></p>

        <ul class="contact">
          <li>
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg>
            </span>
            <span><small>NAME</small><span id="contact-name"></span></span>
          </li>
          <li>
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M3 6h18v12H3z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 6l9 7 9-7" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            </span>
            <span><small>EMAIL</small><span id="contact-email"></span></span>
          </li>
          <li>
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.6 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.6 3.6a1 1 0 0 1-.25 1z"/></svg>
            </span>
            <span><small>PHONE</small><span id="contact-phone"></span></span>
          </li>
          <li>
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
            </span>
            <span><small>LOCATION</small><span id="contact-location"></span></span>
          </li>
        </ul>
      </aside>

      <!-- 오른쪽: PORTFOLIO -->
      <div class="content">
        <h1 class="big-title">PORTFOLIO</h1>

        <p class="headline" id="headline"></p>
        <p class="intro" id="intro"></p>

        <div class="facts">
          <div class="fact">
            <h3>
              <span class="fact-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M12 3 1 9l11 6 9-4.9V17h2V9z"/><path d="M5 13.2V17c0 1.7 3.1 3 7 3s7-1.3 7-3v-3.8l-7 3.8z"/></svg>
              </span>
              EDUCATION
            </h3>
            <p id="education"></p>
          </div>
          <div class="fact">
            <h3>
              <span class="fact-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M22.7 19 13.6 9.9c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg>
              </span>
              SKILLS &amp; TOOLS
            </h3>
            <p id="skills"></p>
          </div>
          <div class="fact">
            <h3>
              <span class="fact-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M10 3h4a2 2 0 0 1 2 2v1h4a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4V5a2 2 0 0 1 2-2zm4 3V5h-4v1z"/></svg>
              </span>
              EXPERIENCE
            </h3>
            <p id="experience"></p>
          </div>
        </div>

        <div class="highlights">
          <h3 class="box-title">PORTFOLIO HIGHLIGHTS</h3>
          <div class="cards" id="cards">
            <p class="empty">불러오는 중...</p>
          </div>
        </div>

        <p class="quote" id="quote"></p>
      </div>
    </section>

    <!-- 방명록 -->
    <section class="sheet guestbook">
      <h2 class="big-title">GUESTBOOK</h2>

      <div class="gb-form">
        <input type="text" id="gb-nickname" maxlength="20" placeholder="별명 (20자까지)">
        <textarea id="gb-message" maxlength="200" rows="3" placeholder="한마디를 남겨 주세요 (200자까지)"></textarea>
        <div class="gb-actions">
          <p class="gb-status" id="gb-status"></p>
          <button type="button" id="gb-submit">남기기</button>
        </div>
      </div>

      <ul class="gb-list" id="gb-list">
        <li class="empty">불러오는 중...</li>
      </ul>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
